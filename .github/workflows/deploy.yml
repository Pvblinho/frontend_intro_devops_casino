name: Deploy Frontend Vidal Casino to AWS

on:
  push:
    branches:
      - deploy

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            pvblinho/casino-frontend:latest
            pvblinho/casino-frontend:${{ github.sha }}

  deploy-to-aws:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to AWS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}  # Aquí GitHub usará la IP del Frontend
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /home/ubuntu/app && cd /home/ubuntu/app
            
            # Detener contenedores previos si existen
            docker stop casino-front-container || true
            docker rm casino-front-container || true
            
            # Descargar la nueva versión y levantar en el puerto 80
            docker pull pvblinho/casino-frontend:latest
            docker run -d --name casino-front-container -p 80:80 pvblinho/casino-frontend:latest