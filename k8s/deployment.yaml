apiVersion: apps/v1
kind: Deployment
metadata:
  name: casino-frontend
  namespace: default
  labels:
    app: casino-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: casino-frontend
  template:
    metadata:
      labels:
        app: casino-frontend
    spec:
      containers:
      - name: casino-frontend
        image: 090493510825.dkr.ecr.us-east-1.amazonaws.com/casino-frontend:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 50m
          limits:
            cpu: 200m
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: casino-frontend
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: casino-frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: casino-frontend-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: casino-frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50